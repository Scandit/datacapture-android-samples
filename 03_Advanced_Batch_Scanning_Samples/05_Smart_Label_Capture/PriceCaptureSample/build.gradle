plugins {
    id("com.android.application")
    id 'org.jetbrains.kotlin.android'
}

android {
    ndkVersion = sdk.ndk
    compileSdkVersion = sdk.compile
    namespace = "com.scandit.datacapture.pricecapturesample"

    defaultConfig {
        applicationId = "com.scandit.datacapture.pricecapturesample"
        minSdkVersion(sdk.min)
        targetSdkVersion(sdk.target)
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility = versions.java
        targetCompatibility = versions.java
    }

    packagingOptions {
        jniLibs {
            pickFirsts += "**/*.so"
            it.useLegacyPackaging project.hasProperty('extractNativeLibs')
        }
    }

    splits {
        abi {
            enable project.hasProperty('enableSplit')
            reset()
            //noinspection ChromeOsAbiSupport
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api "com.scandit.datacapture:core:${versions.scandit_sdk_version}"
    api "com.scandit.datacapture:design:${versions.scandit_sdk_version}"
    api "com.scandit.datacapture:barcode:${versions.scandit_sdk_version}"
    api "com.scandit.datacapture:label:${versions.scandit_sdk_version}"
    api "com.scandit.datacapture:label-text-models:${versions.scandit_sdk_version}"
    api "com.scandit.datacapture:price-label:${versions.scandit_sdk_version}"

    implementation("org.jetbrains.kotlin:kotlin-stdlib:${versions.kotlin}")
    implementation("androidx.appcompat:appcompat:${versions.androidx_appcompat}")
}
